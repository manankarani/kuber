<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --raise: #f5f6f8; --ink: #0b0e14; --ink2: #3d4350; --muted: #5d6472;
  --line: #e7e9ed; --line2: #d4d8de; --sel: #0b0e14; --on-sel: #ffffff;
  --up: #0a7f43; --down: #cf222e; --flat: #5d6472;
  --stock: #0b0e14; --mf: #8b93a3; --chart: #0b0e14; --focus: #2563eb;
  --warn: #9a5b00; --ok: #0a7f43; --sev-hi: #cf222e; --sev-md: #d18b00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --raise: #111317; --ink: #f3f4f6; --ink2: #c4c9d2; --muted: #959cab;
    --line: #1d2026; --line2: #2b2f37; --sel: #f3f4f6; --on-sel: #000000;
    --up: #3ddc84; --down: #ff6369; --flat: #959cab;
    --stock: #f3f4f6; --mf: #6b7383; --chart: #f3f4f6; --focus: #6aa1ff;
    --warn: #f0b04a; --ok: #3ddc84; --sev-hi: #ff6369; --sev-md: #f0b04a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --raise: #111317; --ink: #f3f4f6; --ink2: #c4c9d2; --muted: #959cab;
  --line: #1d2026; --line2: #2b2f37; --sel: #f3f4f6; --on-sel: #000000;
  --up: #3ddc84; --down: #ff6369; --flat: #959cab;
  --stock: #f3f4f6; --mf: #6b7383; --chart: #f3f4f6; --focus: #6aa1ff;
  --warn: #f0b04a; --ok: #3ddc84; --sev-hi: #ff6369; --sev-md: #f0b04a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; accent-color: var(--ink); scrollbar-color: var(--line2) transparent; caret-color: var(--ink); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
::selection { background: color-mix(in oklab, var(--focus) 24%, transparent); }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:is(button, select, input, summary, [role=button]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.up { color: var(--up); } .down { color: var(--down); }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

/* top bar */
header { position: sticky; top: 0; z-index: 5; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.bar { display: flex; align-items: center; gap: 12px; height: 60px; }
.logo { font-weight: 780; font-size: 22px; letter-spacing: -.035em; font-stretch: 125%; }
.spacer { flex: 1; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--raise); border-radius: 999px; }
.seg button { border: 0; background: none; color: var(--ink2); font-size: 14px; font-weight: 600; padding: 0 14px; min-height: 36px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; cursor: pointer; flex: none; }
.people { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 14px 40px 6px 0; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); }
.people::-webkit-scrollbar { display: none; }
.person { flex: none; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); font-size: 15px; font-weight: 600; padding: 0 16px; min-height: 40px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.person:hover { border-color: var(--ink2); }
.person[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); border-color: var(--sel); }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; padding-top: 18px; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
section + section, .rail > section + section { margin-top: 40px; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -.015em; margin: 0 0 6px; }
.rail h2 { font-size: 17px; }

/* lock screen: the published page carries only encrypted data until the family passphrase opens it */
#lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; }
#lock[hidden] { display: none; }
#lock > div { width: min(360px, 100%); display: grid; gap: 12px; }
.lk-t { font-size: 34px; font-weight: 800; font-stretch: 108%; margin: 0 0 4px; }
#lock label { font-size: 16px; color: var(--muted); }
#lock input { font: inherit; font-size: 18px; padding: 12px 14px; min-height: 48px; border: 1px solid var(--line2); border-radius: 12px; background: var(--raise); color: var(--ink); }
#lock button { font: inherit; font-weight: 700; font-size: 17px; min-height: 48px; border: 0; border-radius: 999px; background: var(--sel); color: var(--on-sel); cursor: pointer; }
#lk-e { min-height: 1.4em; color: var(--muted); font-size: 15px; margin: 0; }
/* hero + chart */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.big { font-size: clamp(44px, 9vw, 64px); font-weight: 720; font-stretch: 108%; letter-spacing: -.04em; line-height: 1; margin: 10px 0 0; }
.chg { font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.chg > span { white-space: nowrap; } .chg .lbl { color: var(--muted); font-weight: 500; margin-left: 6px; }
.chart { margin-top: 18px; position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
.chart .inv { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s cubic-bezier(.16, 1, .3, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .gain { stroke-width: 3; stroke-linecap: round; }
.chart .glabel { font-size: 14px; font-weight: 700; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.chart .val { fill: none; stroke-width: 2.5; }
.chart .now { stroke: var(--bg); stroke-width: 3; }
.chart .gap { stroke-dasharray: 4 4; stroke-width: 2; fill: none; }
.chart .cursor { stroke: var(--line2); stroke-width: 1; display: none; } .chart .cursor.on { display: inline; }
.ranges { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 10px; }
.ranges button { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 700; padding: 0 14px; min-height: 44px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ranges button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; text-wrap: pretty; }

/* key stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 24px; }
.stat { padding: 14px 0; border-bottom: 1px solid var(--line); }
.stat dt { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat dd { margin: 4px 0 0; font-size: 18px; font-weight: 650; }

/* holdings */
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 4px 0 6px; }
.tools h2 { flex: 1; margin: 0; }
input[type=search], select { font-size: 15px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg); }
input[type=search] { width: 220px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 90px 130px; gap: 16px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: right; -webkit-tap-highlight-color: transparent; }
.row > :first-child { text-align: left; min-width: 0; }
.row:hover, .row:active { background: var(--raise); }
.row.head { cursor: default; padding: 10px 4px; font-size: 13px; color: var(--muted); font-weight: 600; } .row.head:hover { background: none; }
.nm { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.held { color: var(--ink2); }
.v { font-weight: 650; }
.day, .ret { font-weight: 600; font-size: 15px; }
.more { display: block; margin: 16px auto 0; border: 1px solid var(--line2); background: var(--bg); border-radius: 999px; padding: 0 22px; min-height: 44px; font-size: 15px; font-weight: 600; cursor: pointer; }
.empty { padding: 32px 0; text-align: center; color: var(--muted); }

/* right rail */
.alloc .track { display: flex; gap: 3px; height: 10px; border-radius: 5px; overflow: hidden; margin: 12px 0; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.legend div { display: flex; align-items: center; gap: 8px; } .legend b { margin-left: auto; font-weight: 650; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); border-left: 0; border-right: 0; border-top: 0; background: none; text-align: left; width: 100%; cursor: pointer; min-height: 56px; }
.li:hover { background: var(--raise); }
.li .t { flex: 1; min-width: 0; } .li .t b { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .r { text-align: right; font-weight: 650; white-space: nowrap; }
.li .r small { display: block; font-size: 13px; font-weight: 600; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--raise); display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; }
.back { border: 0; background: none; color: var(--focus); font-weight: 600; font-size: 15px; cursor: pointer; padding: 0; min-height: 44px; }
.issues details { border-bottom: 1px solid var(--line); }
.issues summary { display: flex; align-items: center; gap: 10px; min-height: 52px; cursor: pointer; list-style: none; font-size: 15px; font-weight: 600; }
.issues summary::-webkit-details-marker { display: none; }
.issues summary::after { content: ""; width: 7px; height: 7px; margin: 0 6px 0 4px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s ease-out; flex: none; }
.issues details[open] summary::after { transform: rotate(45deg); }
.issues .cnt { margin-left: auto; color: var(--ink2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.hi { background: var(--sev-hi); } .dot.md { background: var(--sev-md); } .dot.lo { background: var(--line2); }
.issues ul { list-style: none; margin: 0 0 12px; padding: 0; max-height: 320px; overflow: auto; }
.issues li { font-size: 14px; padding: 8px 0; border-top: 1px solid var(--line); color: var(--ink2); }
.issues li b { color: var(--ink); font-weight: 600; }

/* holding timeline */
dialog#tl { width: min(600px, calc(100vw - 24px)); max-height: calc(100dvh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0,0,0,.35); }
dialog#tl::backdrop { background: rgba(0,0,0,.4); }
.tl-h { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 20px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.tl-h h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.tl-h .icon-btn { margin-left: auto; }
.tl-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.tl-b { padding: 6px 20px 22px; }
.tl-l { list-style: none; margin: 0; padding: 0; position: relative; }
.tl-l::before { content: ""; position: absolute; left: 5px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.tl-l li { position: relative; padding: 12px 0 12px 26px; display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 2px 14px; font-size: 15px; }
.tl-l li::before { content: ""; position: absolute; left: 0; top: 17px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--line2)); box-shadow: 0 0 0 3px var(--bg); }
.tl-l .dt { color: var(--muted); font-size: 14px; }
.tl-l .tt b { font-weight: 700; }
.src { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; background: var(--raise); color: var(--ink2); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); }
.tl-f { color: var(--muted); font-size: 13px; margin-top: 14px; }

/* tablet: rail drops below */
@media (max-width: 980px) {
  .grid { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .rail { margin-top: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 32px; }
  .rail > section + section { margin-top: 0; }
}
/* phone: one column, every target a fingertip */
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .bar { height: 60px; } .seg button { padding: 0 12px; min-height: 44px; } .icon-btn { width: 44px; height: 44px; }
  .person { min-height: 44px; }
  .chart svg { height: 170px; }
  .main { display: flex; flex-direction: column; } .main > section + section { margin-top: 28px; }
  .main > .k-stats { order: 3; margin-top: 36px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .rail { grid-template-columns: minmax(0, 1fr); }
  input[type=search] { width: 100%; order: 3; min-height: 44px; font-size: 16px; } select { min-height: 44px; font-size: 16px; }
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
  .row.head, .row .c-gain, .row .c-day { display: none; }
  .row .l2 { display: block; }
  dialog#tl { width: 100%; max-width: none; margin: auto 0 0; max-height: 90dvh; border-radius: 20px 20px 0 0; border-bottom: 0; }
  .tl-b { padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
  .tl-l li { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 641px) { .row .l2 { display: none; } .row .nm { white-space: normal; overflow: visible; text-wrap: balance; } }  /* desktop has room: show the whole name */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <span class="logo">Kuber</span>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Asset type" id="seg">
      <button data-v="all" aria-pressed="true">All</button><button data-v="stock" aria-pressed="false">Stocks</button><button data-v="mf" aria-pressed="false">Funds</button>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </div>
</header>
<div class="wrap"><nav class="people" id="people" aria-label="Family member"></nav></div>
<main class="wrap grid">
  <div class="main">
    <section aria-labelledby="who">
      <h1 class="sr" id="who"></h1>
      <p class="big" id="big"></p>
      <div class="chg num" id="chg"></div>
      <div class="chart" id="chart"></div>
      <div class="ranges" role="group" aria-label="Chart range" id="ranges">
        <button data-v="1">1Y</button><button data-v="3">3Y</button><button data-v="5">5Y</button><button data-v="0" aria-pressed="true">All</button>
      </div>
      <p class="note" id="chart-note"></p>
    </section>
    <section aria-label="Key figures" class="k-stats"><dl class="stats" id="stats"></dl></section>
    <section id="holdings" aria-labelledby="h-hold">
      <div class="tools">
        <h2 id="h-hold">Holdings</h2>
        <input type="search" id="q" placeholder="Search holdings" aria-label="Search holdings">
        <select id="sort" aria-label="Sort by">
          <option value="value">Value</option><option value="chg">Today</option><option value="gain">Gain ₹</option><option value="gainPct">Return %</option>
          <option value="xirr">XIRR</option><option value="invested">Invested</option><option value="name">Name</option>
        </select>
      </div>
      <div id="list"></div>
      <button class="more" id="more" hidden>Show all</button>
    </section>
  </div>
  <aside class="rail">
    <section class="alloc" aria-labelledby="h-alloc"><h2 id="h-alloc">Allocation</h2><div id="alloc"></div></section>
    <section aria-labelledby="fam-h"><h2 id="fam-h">Family</h2><div class="list" id="fam"></div></section>
    <section aria-labelledby="h-mov"><h2 id="h-mov">Today's movers</h2><div class="list" id="movers"></div></section>
    <section class="issues" aria-labelledby="h-rev"><h2 id="h-rev">Needs review</h2><div id="issues"></div></section>
  </aside>
</main>
<dialog id="tl" aria-labelledby="tl-name"><div class="tl-h"><div><h3 id="tl-name"></h3><div class="tl-sub num" id="tl-sub"></div></div>
  <button class="icon-btn" id="tl-x" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div><div class="tl-b" id="tl-body"></div></dialog>
<form id="lock" hidden><div><p class="lk-t">Kuber</p><label for="pw">Family passphrase</label>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
  <button>Unlock</button><p id="lk-e" role="alert"></p></div></form>

  return ACRO.has(u) || new RegExp(`\\b${u}\\b`).test(short) && u.length <= 5 && u === short.match(new RegExp(`\\b${u}\\b`))?.[0] ? w.toUpperCase() : w; }).join(' ');
const PREFIX = /^((after\s+)?(sub[\s-]?div\w*|split|bonus)|with face value.*?after(\s+(sub[\s-]?div\w*|split))?)\s*/i;  // depository's corporate-action notes
const tidy = s => s.replace(PREFIX, '').replace(/ And /g, ' & ').replace(/ (Of|For|The|In|On) /g, (m, w) => ` ${w.toLowerCase()} `);
const label = h => { const n = h.isin && NAMES[h.isin] && !/^IN[A-Z0-9]{10}$/.test(NAMES[h.isin]) ? tidy(recap(NAMES[h.isin], h.name)) : '';
  return n.length > 2 ? n : h.name; };  // a note with no name left ('With Face Value Rs. 2/- After') falls back to the short name
// consolidate account-level rows into one holding per (type, name)
function consolidate(rows) {
  const m = new Map();
  for (const r of rows) {
    const k = r.type + '|' + r.name;
    const h = m.get(k) || m.set(k, { ...r, qty: 0, invested: 0, value: 0, today: 0, lots: 0, flows: [], first: null, members: new Set(), accs: new Set() }).get(k);
    h.qty += r.qty; h.invested += r.invested; h.value += r.value; h.today += r.today; h.lots += r.lots;
    h.flows = h.flows.concat(r.flows); h.members.add(memberOf(r.acc)); h.accs.add(r.acc);
    if (r.first && (!h.first || r.first < h.first)) h.first = r.first;
  }
  return [...m.values()].map(h => {
    h.label = label(h);
    h.costKnown = h.invested >= 0.01 * h.value;  // cost ~₹0 (demerger/unknown): a return figure would be fiction
    h.gain = h.value - h.invested; h.gainPct = h.invested > 0 && h.costKnown ? h.gain / h.invested * 100 : null;
    h.xirr = age(h) >= 365 ? xirr(h.flows) : null; // <1y annualises noise
    return h;
  }).sort((a, b) => b.value - a.value);
}

// headline: today's worth, or the chart point under the finger while scrubbing
let shownValue = null, roll = 0;
function rollTo(v) {  // one authored moment: the number counts to its new value when the view changes
  cancelAnimationFrame(roll);
  const from = shownValue ?? v, t0 = performance.now(), dur = motion && from !== v ? 450 : 0;
  const step = now => { const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 4);
    $('big').textContent = short(from + (v - from) * e); if (k < 1) roll = requestAnimationFrame(step); };
  shownValue = v; step(t0);
}
function showHero(p) {

}

// the headline chart: money put in over time (dated purchases), then recorded worth from the daily snapshots
function series() {
  const dated = S.flatMap(h => h.flows.map(([d, inv]) => [ASOF - d * DAY, inv])).sort((a, b) => a[0] - b[0]);
  const undated = hero.inv - dated.reduce((a, f) => a + f[1], 0);
  let c = Math.max(0, undated); const inv = [];
  for (const [t, x] of dated) { c += x; inv.push([t, c]); }
  inv.push([ASOF, c]);
  const key = member === 'all' ? 'all' : member;
  const val = Object.entries(D.history || {}).map(([d, m]) => [Date.parse(d), m[key] ? (seg === 'all' ? m[key].stock + m[key].mf : m[key][seg] || 0) : null])
    .filter(p => p[1] != null).sort((a, b) => a[0] - b[0]);
  return { inv, val, undated };
}
const motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;
function chart() {

  const { inv, val, undated } = series();
  const t0 = range ? ASOF - range * 365.25 * DAY : (inv[0] ? inv[0][0] : ASOF - 365 * DAY);
  const clip = pts => { const out = pts.filter(p => p[0] >= t0); const before = pts.filter(p => p[0] < t0).pop(); return before ? [[t0, before[1]], ...out] : out; };
  const I = clip(inv), V = clip(val);
  if (I.length < 2) { el.innerHTML = ''; $('chart-note').textContent = 'No dated purchases in this range.'; return; }
  const ys = [...I, ...V, [ASOF, hero.value]].map(p => p[1]), lo = 0, hi = Math.max(...ys) * 1.06 || 1;
  const x = t => pad + (t - t0) / (ASOF - t0 || 1) * (W - pad * 2), y = v => H - 4 - (v - lo) / (hi - lo) * (H - 12);
  const step = pts => pts.map((p, i) => (i ? `H${x(p[0]).toFixed(1)}V${y(p[1]).toFixed(1)}` : `M${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`)).join('');
  const invPath = step(I), last = I[I.length - 1];
  const vcol = hero.value >= hero.inv ? 'var(--up)' : 'var(--down)', gx = x(ASOF).toFixed(1), gy0 = y(last[1]), gy1 = y(hero.value);
  const valPath = V.length > 1 ? V.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('') : '';
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money invested over time, ${short(last[1])} by today; worth today ${short(hero.value)}">
    <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--muted);stop-opacity:.14"/><stop offset="1" style="stop-color:var(--muted);stop-opacity:0"/></linearGradient></defs>
    <path d="${invPath}V${H}H${x(I[0][0]).toFixed(1)}Z" fill="url(#fade)"/><path class="inv ${motion ? 'draw' : ''}" d="${invPath}" stroke="var(--muted)"/>
    <text class="glabel" x="${(+gx - 10).toFixed(1)}" y="${(hero.value >= hero.inv && gy0 + 22 < H ? gy0 + 22 : gy0 - 10).toFixed(1)}" text-anchor="end" fill="var(--muted)">Invested ${short(last[1])}</text>
    ${valPath ? `<path class="val" d="${valPath}" stroke="${vcol}"/>` : `<line class="gap" x1="${gx}" x2="${gx}" y1="${gy0.toFixed(1)}" y2="${gy1.toFixed(1)}" stroke="${vcol}"/>
      <text class="glabel" x="${(+gx - 10).toFixed(1)}" y="${((gy0 + gy1) / 2 + 4).toFixed(1)}" text-anchor="end" fill="${vcol}">${hero.value >= hero.inv ? 'Gain' : 'Loss'} ${signed(hero.value - hero.inv)}</text>`}
    <circle class="now" cx="${gx}" cy="${gy1.toFixed(1)}" r="6" fill="${vcol}"/>
    <line class="cursor" id="cur" y1="0" y2="${H}" x1="-9" x2="-9"/></svg>`;

    + (val.length > 1 ? ` Worth recorded since ${fmtD(new Date(val[0][0]))}.` : ' Worth history fills in daily from now on.');
  $('chart-note').textContent = innerWidth <= 640 ? 'Grey: money put in · dot: worth today' : note;
  $('chart-note').title = note;
  const ln = el.querySelector('.inv'); if (ln) ln.style.setProperty('--len', Math.ceil(ln.getTotalLength()));
  // signature: scrub the chart and the headline follows
  const svg = el.querySelector('svg'), pts = [...I.map(p => ({ t: p[0], v: p[1], kind: 'inv' })), ...V.map(p => ({ t: p[0], v: p[1], kind: 'value' }))];

    return v && Math.abs(v[0] - t) < 3 * DAY ? { t: v[0], v: v[1], kind: 'value', px: e.clientX - r.left } : best && { t: Math.max(best[0], t0), v: best[1], kind: 'inv', px: e.clientX - r.left }; };

// holding timeline: contract-note trades + depository events, following ISIN changes (splits, mergers, renames)
const key = h => h.type + '|' + h.name;
const rs = v => '₹' + Number(v).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const days = (a, b) => Math.abs(Date.parse(a) - Date.parse(b)) / DAY;
const CA = { Split: 1, Bonus: 1, Rights: 1, 'Rights entitlement': 1, IPO: 1, Converted: 1, Renamed: 1, Demerger: 1, Merger: 1 };
function timeline(k) {
  const h = S.find(x => key(x) === k); if (!h) return;
  const rows = D.rows.filter(r => key(r) === k && (member === 'all' || memberOf(r.acc) === member));
  const ev = [], isins = new Set(), srcs = new Set();
  for (const r of rows) {
    const who = memberOf(r.acc), c = (D.cas || {})[who];
    (r.buys || []).forEach(([d, q, px, op, ratio]) => {
      if (['note', 'bonus', 'ipo', 'rights', 'ca'].includes(op)) return;  // shown by their contract-note / depository events
      ev.push({ d, k: op === 'hint' ? 'Hint' : op === 'lot' ? 'Fix' : 'Lot', q, px, op, ratio, who, src: op === 'hint' ? 'Moneycontrol hint' : 'Moneycontrol' });
    });
    if (!c || !r.isin) continue;
    srcs.add(who);
    const walk = i => { if (isins.has(i)) return; isins.add(i); (c.events[i] || []).forEach(e => ev.push({ ...e, isin: i, who, names: c.names })); (c.links[i] || []).forEach(walk); };
    walk(r.isin);
  }
  const cn = ev.filter(e => e.src === 'Contract note');
  for (const l of ev.filter(e => e.k === 'Lot')) {
    const t = cn.find(e => !e.mc && e.k === 'Buy' && e.who === l.who && Math.abs(e.q - l.q / l.ratio) < 1e-6 && days(e.d, l.d) <= 3);
    if (t) { t.mc = true; l.drop = true; }
  }
  for (const b of ev.filter(e => e.src === 'CAS' && (e.k === 'Buy' || e.k === 'Sell')))
    if (cn.some(e => e.k === b.k && e.who === b.who && Math.abs(e.q - b.q) < 1e-6 && Date.parse(e.d) <= Date.parse(b.d) && days(e.d, b.d) <= 5)) b.drop = true;
  for (const f of ev.filter(e => e.k === 'Fix')) {
    const e = ev.find(e => e !== f && e.k !== 'Lot' && e.k !== 'Fix' && e.who === f.who && Math.abs(e.q - f.q) < 1e-6 && (!f.d || days(e.d, f.d) <= 5));
    if (e) { e.fixed = true; f.drop = true; } else f.k = 'Held';
  }
  const nm = e => (e.names && e.names[e.isin]) || h.name;
  const title = e => ({
    Lot: () => `Bought <b>${inr.format(e.q / e.ratio)}</b> @ ${rs(e.px * e.ratio)}`,
    Held: () => `Held <b>${inr.format(e.q)}</b> before the first statement`,
    Hint: () => `<b>${inr.format(e.q)}</b> shares bought before the contract notes on hand`,
    Buy: () => `Bought <b>${inr.format(e.q)}</b>${e.px ? ` @ ${rs(e.px)}` : ''}`,
    Sell: () => `Sold <b>${inr.format(-e.q)}</b>${e.px ? ` @ ${rs(e.px)}` : ''}`,
    Split: () => `Split: <b>${inr.format(e.frm ? e.frm[0] : 0)}</b> → <b>${inr.format(e.q)}</b> shares`,
    Converted: () => `<b>${inr.format(e.frm[0])}</b> ${esc(e.frm[2] || e.frm[1])} → <b>${inr.format(e.q)}</b> ${esc(nm(e))}`,
    Renamed: () => `Renamed <b>${esc(e.frm[2])}</b> → <b>${esc(nm(e))}</b>`,
    Bonus: () => `Bonus <b>+${inr.format(e.q)}</b> shares`,
    Rights: () => `Rights issue <b>+${inr.format(e.q)}</b> shares`,
    'Rights entitlement': () => `Rights entitlement <b>${inr.format(e.q)}</b>`,
    IPO: () => `IPO allotment <b>${inr.format(e.q)}</b> shares`,
    Demerger: () => `Demerger <b>+${inr.format(e.q)}</b> ${esc(nm(e))}`,
    Merger: () => `Merger <b>${e.q > 0 ? '+' : ''}${inr.format(e.q)}</b> ${esc(nm(e))}`,
  }[e.k] || (() => `${e.q >= 0 ? 'Credit' : 'Debit'} <b>${inr.format(Math.abs(e.q))}</b>`))();
  const color = e => e.k === 'Sell' || e.q < 0 ? 'var(--down)' : CA[e.k] ? 'var(--ink)' : e.k === 'Held' || e.k === 'Hint' ? 'var(--line2)' : 'var(--up)';
  const pills = e => [
    e.src === 'Contract note' ? `<span class="pill">Contract note</span>` : e.src === 'CAS' ? `<span class="pill">Depository</span>` : '',
    e.k === 'Hint' ? `<span class="pill warn">${rs(e.px)}/share · Moneycontrol, unverified</span>` : '',
    e.k === 'Lot' ? `<span class="pill warn">Moneycontrol, unverified</span>` : '',
    e.op === 'split' ? `<span class="pill ok">split-adjusted: ${inr.format(e.q)} @ ${rs(e.px)}</span>` : '',
    e.fixed ? `<span class="pill ok">added by Kuber</span>` : '',
    e.src === 'CAS' && e.bal >= 0 ? `<span class="pill">balance ${inr.format(e.bal)}</span>` : '',
    member === 'all' && MEMBERS.length > 1 ? `<span class="pill">${esc(e.who)}</span>` : ''].join('');
  const list = ev.filter(e => !e.drop).sort((a, b) => (a.d || '').localeCompare(b.d || ''));
  $('tl-name').textContent = h.label;
  $('tl-sub').innerHTML = `${inr.format(h.qty)} ${h.type === 'mf' ? 'units' : 'shares'} · ${short(h.value)} · ${h.gainPct == null ? 'cost unknown' : `<span class="${cls(h.gain)}">${pct(h.gainPct, 0)}</span>`}${isins.size ? ` · ${[...isins].map(esc).join(' ← ')}` : ''}`;
  const cas = [...srcs].map(m => D.cas[m]);
  $('tl-body').innerHTML = (list.length ? `<ol class="tl-l">${list.map(e => `<li style="--c:${color(e)}"><span class="dt num">${fmtD(e.d)}</span>
      <div><div class="tt num">${title(e)}</div><div class="src">${pills(e)}</div></div></li>`).join('')}</ol>` : '<div class="empty">No recorded events for this holding yet.</div>')
    + `<div class="tl-f">${cas.length ? `From contract notes and depository statements for ${[...srcs].map(esc).join(', ')}; latest statement ${esc(fmtD(cas.map(c => c.asOf).sort().pop()))}.` : 'No statements for this member yet.'}</div>`;
  $('tl').showModal();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-key]'); if (el && !e.target.closest('dialog')) timeline(el.dataset.key); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches?.('[data-key]')) timeline(e.target.dataset.key); });
$('tl-x').onclick = () => $('tl').close();
$('tl').onclick = e => { if (e.target === $('tl')) $('tl').close(); };

render();
})();
</script>
</body>
</html>
